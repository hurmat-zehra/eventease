<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Event Ease - HOD Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #FFFDF6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      color: #2c3e50;
    }

    .header {
      background-color: #A0C878;
      color: #fff;
      padding: 1.2rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
    }

    .logo {
      margin: 0;
      font-size: 1.6rem;
      font-weight: 600;
    }

    nav a {
      color: #fff;
      margin-left: 1rem;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    nav a:hover {
      color: #DDEB9D;
    }

    .section {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    .form {
      background: #FAF6E9;
      padding: 2.8rem 2.2rem;
      border-radius: 18px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 420px;
      animation: fadeIn 0.6s ease-out;
    }

    .form h2 {
      margin-bottom: 1.8rem;
      font-weight: 600;
      font-size: 1.5rem;
      color: #34495e;
    }

    .form input[type="email"],
    .form input[type="password"] {
      width: 100%;
      padding: 0.85rem;
      margin: 0.7rem 0;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    .form input:focus {
      border-color: #A0C878;
      box-shadow: 0 0 5px rgba(160, 200, 120, 0.4);
      outline: none;
    }

    .checkbox {
      display: flex;
      align-items: center;
      margin: 0.8rem 0 0.4rem;
      font-size: 0.9rem;
      color: #555;
    }

    .checkbox input {
      margin-right: 0.5rem;
    }

    .form button {
      width: 100%;
      padding: 0.85rem;
      margin-top: 1.2rem;
      background-color: #DDEB9D;
      border: none;
      color: #34495e;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
    }

    .form button:hover {
      background-color: #C5DD71;
      box-shadow: 0 8px 18px rgba(173, 214, 89, 0.3);
    }

    .error-message {
      display: none;
      margin-top: 1rem;
      color: #e74c3c;
      font-size: 0.9rem;
      text-align: left;
    }

    footer {
      text-align: center;
      padding: 1.2rem;
      background-color: #FFFDF6;
      color: #777;
      font-size: 0.9rem;
      border-top: 1px solid #ddd;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .form {
        padding: 2rem 1.5rem;
      }
    }
  </style>
</head>
<body>

  <header class="header">
    <h1 class="logo">Event Ease</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="gallery.html">Gallery</a>
    </nav>
  </header>

  <main class="section">
    <form id="login-form" class="form">
      <h2>HOD Login</h2>
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required />
      
      <label class="checkbox">
        <input type="checkbox" id="show-password" />
        Show Password
      </label>

      <p class="error-message" id="error-message">Invalid login. Please try again.</p>
      <button type="submit">Login</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2025 Event Ease. All rights reserved.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="supabase-config.js"></script>
  <script>
    document.getElementById('show-password').addEventListener('change', function () {
      const passwordInput = document.getElementById('password');
      passwordInput.type = this.checked ? 'text' : 'password';
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorMessage = document.getElementById('error-message');

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          errorMessage.textContent = error.message;
          errorMessage.style.display = 'block';
        } else {
          errorMessage.style.display = 'none';
          window.location.href = 'dashboard.html';
        }
      } catch (err) {
        errorMessage.textContent = 'Unexpected error occurred.';
        errorMessage.style.display = 'block';
      }
    });
  </script>

</body>
</html>
